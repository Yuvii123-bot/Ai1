<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Working Orrery</title>
<style>
:root{
  --bg:#05060a; --paper:#efe9dd; --dim:#8b8778; --brass:#c9a86a; --brass-hi:#e8cf9a;
  --line:rgba(201,168,106,.18); --mono:"JetBrains Mono",ui-monospace,monospace;
  --sans:"Inter",-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--paper);font-family:var(--sans);overflow:hidden}
canvas{display:block;position:absolute;inset:0;touch-action:none}

/* ---- top bar ---- */
#hud{
  position:absolute;top:0;left:0;right:0;padding:22px 26px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
  pointer-events:none;z-index:5;
}
#hud .left{pointer-events:auto}
h1{
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;
  font-size:27px;letter-spacing:.01em;line-height:1;
}
h1 em{font-style:italic;color:var(--brass-hi)}
.sub{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);margin-top:8px}

#datebox{text-align:right;pointer-events:auto}
#date{
  font-family:var(--mono);font-size:clamp(15px,2vw,22px);color:var(--brass-hi);
  letter-spacing:.04em;font-variant-numeric:tabular-nums;
}
#speedlbl{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-top:7px}

/* ---- bottom controls ---- */
#controls{
  position:absolute;bottom:0;left:0;right:0;padding:0 26px 24px;z-index:5;
  display:flex;flex-direction:column;gap:14px;align-items:center;
}
.speeds{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.speeds button{
  background:rgba(15,17,24,.7);border:1px solid var(--line);color:var(--dim);
  padding:7px 13px;border-radius:100px;font-family:var(--sans);
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
  transition:all .3s;backdrop-filter:blur(10px);
}
.speeds button:hover{color:var(--brass-hi);border-color:rgba(201,168,106,.4)}
.speeds button.on{background:rgba(201,168,106,.14);border-color:var(--brass);color:var(--brass-hi)}

#scrubrow{
  display:flex;align-items:center;gap:14px;width:min(760px,100%);
  background:rgba(11,13,18,.72);border:1px solid var(--line);border-radius:100px;
  padding:9px 20px;backdrop-filter:blur(14px);
}
#play{
  width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:1px solid rgba(201,168,106,.45);
  background:rgba(201,168,106,.1);color:var(--brass-hi);cursor:pointer;
  display:grid;place-items:center;font-size:11px;transition:all .3s;
}
#play:hover{background:rgba(201,168,106,.24);transform:scale(1.06)}
input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;height:2px;background:rgba(201,168,106,.22);
  border-radius:2px;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--brass-hi);box-shadow:0 0 12px 2px rgba(232,207,154,.55);cursor:grab;
}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border:0;border-radius:50%;background:var(--brass-hi);
  box-shadow:0 0 12px 2px rgba(232,207,154,.55);
}
.toggles{display:flex;gap:6px;flex:0 0 auto}
.toggles button{
  background:none;border:1px solid var(--line);color:var(--dim);cursor:pointer;
  font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;padding:5px 8px;border-radius:3px;
  font-family:var(--sans);transition:.3s;
}
.toggles button.on{color:var(--brass-hi);border-color:rgba(201,168,106,.4);background:rgba(201,168,106,.1)}

/* ---- planet card ---- */
#card{
  position:absolute;z-index:6;width:238px;pointer-events:none;
  background:linear-gradient(165deg,rgba(19,22,31,.97),rgba(8,9,13,.98));
  border:1px solid rgba(201,168,106,.28);border-radius:4px;padding:16px 18px;
  backdrop-filter:blur(18px);box-shadow:0 22px 60px -20px #000;
  opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;
}
#card.show{opacity:1;transform:none}
#card .nm{font-family:"Cormorant Garamond",serif;font-size:21px;color:var(--brass-hi);line-height:1}
#card .ty{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:6px}
#card dl{display:grid;grid-template-columns:auto auto;gap:5px 12px;margin-top:13px;font-size:10.5px}
#card dt{color:var(--dim);letter-spacing:.06em}
#card dd{text-align:right;font-family:var(--mono);font-size:10px;color:var(--paper);font-variant-numeric:tabular-nums}
#card .fact{margin-top:12px;font-size:10.5px;line-height:1.55;color:var(--dim);border-top:1px solid rgba(201,168,106,.16);padding-top:10px}

#hint{
  position:absolute;left:50%;bottom:118px;transform:translateX(-50%);
  font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:rgba(139,135,120,.75);
  pointer-events:none;z-index:4;transition:opacity 1s;white-space:nowrap;
}
#almanac{
  position:absolute;left:26px;bottom:26px;z-index:5;font-family:var(--mono);
  font-size:9.5px;color:var(--dim);line-height:1.9;pointer-events:none;
}
#almanac b{color:var(--brass);font-weight:400}
@media (max-width:760px){
  #hud{padding:16px}
  h1{font-size:20px}
  #almanac{display:none}
  #card{width:200px}
  #hint{display:none}
}

/* --- collection navigator --- */
#cabnav{position:fixed;left:0;right:0;bottom:0;z-index:8000;display:flex;align-items:center;
justify-content:center;gap:5px;padding:7px 12px;background:rgba(7,8,13,.82);
border-top:1px solid rgba(201,168,106,.13);backdrop-filter:blur(14px);
font-family:"Inter",-apple-system,sans-serif;transform:translateY(105%);
transition:transform .45s cubic-bezier(.16,1,.3,1)}
#cabnav.show{transform:none}
#cabnav a{font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:#6f6a60;
text-decoration:none;padding:5px 8px;border-radius:3px;transition:.25s;white-space:nowrap}
#cabnav a:hover{color:#e8cf9a;background:rgba(201,168,106,.13)}
#cabnav a.cur{color:#c9a86a;background:rgba(201,168,106,.1)}
#cabnav .home{color:#c9a86a;border-right:1px solid rgba(201,168,106,.18);margin-right:4px;padding-right:12px}
@media(max-width:620px){#cabnav a{font-size:7px;padding:4px 4px;letter-spacing:.04em}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="left">
    <h1>The Working <em>Orrery</em></h1>
    <div class="sub">Keplerian motion · live</div>
  </div>
  <div id="datebox">
    <div id="date">—</div>
    <div id="speedlbl">1 day / second</div>
  </div>
</div>

<div id="almanac"></div>

<div id="card">
  <div class="nm"></div>
  <div class="ty"></div>
  <dl></dl>
  <div class="fact"></div>
</div>

<div id="hint">click a world · drag the slider to travel in time</div>

<div id="controls">
  <div class="speeds">
    <button data-sp="0.25">¼ day/s</button>
    <button data-sp="1" class="on">1 day/s</button>
    <button data-sp="7">1 week/s</button>
    <button data-sp="30.4">1 month/s</button>
    <button data-sp="365.25">1 year/s</button>
    <button data-sp="3652">1 decade/s</button>
  </div>
  <div id="scrubrow">
    <button id="play" title="Play / pause">❚❚</button>
    <input type="range" id="time" min="-400" max="400" step="0.05" value="0">
    <div class="toggles">
      <button data-t="orbits" class="on">orbits</button>
      <button data-t="labels" class="on">names</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   THE WORKING ORRERY
   Real heliocentric elements (J2000). Kepler's equation is
   solved every frame for every body — this is not decoration.
   ============================================================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = Math.min(devicePixelRatio || 1, 2);

function resize(){
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

const DEG = Math.PI / 180;
const J2000 = Date.UTC(2000, 0, 1, 12, 0, 0);

/* a: semi-major axis (AU) · e: eccentricity · P: period (yr)
   L0: mean longitude at J2000 (deg) · peri: longitude of perihelion (deg)
   r: radius (km) · col: colour · fact */
const BODIES = [
  { id:'mercury', name:'Mercury', a:0.38710, e:0.20563, P:0.240847, L0:252.25, peri:77.46,
    inc:7.00, r:2440, col:'#b9a894', type:'terrestrial world',
    fact:'A year here lasts 88 days. Its day lasts 176. Gravity has kneaded it into a wrinkled iron ball.' },
  { id:'venus', name:'Venus', a:0.72333, e:0.00677, P:0.615197, L0:181.98, peri:131.53,
    inc:3.39, r:6052, col:'#e6c793', type:'terrestrial world',
    fact:'Earth\u2019s twin gone wrong. 465\u00b0C beneath clouds of sulphuric acid, and it spins backwards.' },
  { id:'earth', name:'Earth', a:1.00000, e:0.01671, P:1.000000, L0:100.46, peri:102.95,
    inc:0, r:6371, col:'#5d93dd', type:'home',
    fact:'The only world in this orrery with a witness. You are the witness.' },
  { id:'mars', name:'Mars', a:1.52371, e:0.09339, P:1.880848, L0:355.45, peri:336.06,
    inc:1.85, r:3390, col:'#c25a3c', type:'terrestrial world',
    fact:'Rust and silence. Olympus Mons rises 22 km — nearly three Everests stacked on each other.' },
  { id:'jupiter', name:'Jupiter', a:5.20288, e:0.04839, P:11.862615, L0:34.40, peri:14.75,
    inc:1.30, r:69911, col:'#d8a271', type:'gas giant',
    fact:'A failed star that guards the inner worlds. The Great Red Spot has raged for centuries.' },
  { id:'saturn', name:'Saturn', a:9.53667, e:0.05386, P:29.447498, L0:49.94, peri:92.43,
    inc:2.49, r:58232, col:'#e5cb8f', type:'gas giant', rings:true,
    fact:'Less dense than water. Its rings are ice and rubble, only tens of metres thick.' },
  { id:'uranus', name:'Uranus', a:19.18916, e:0.04726, P:84.016846, L0:313.23, peri:170.96,
    inc:0.77, r:25362, col:'#9ad9dc', type:'ice giant',
    fact:'Toppled onto its side, probably by an ancient collision. It rolls around the Sun.' },
  { id:'neptune', name:'Neptune', a:30.06992, e:0.00859, P:164.79132, L0:304.88, peri:44.97,
    inc:1.77, r:24622, col:'#5177d8', type:'ice giant',
    fact:'Found by mathematics before anyone saw it. Winds of 2,100 km/h — the fastest in the system.' }
];

/* Kepler: solve M = E - e sin E by Newton iteration */
function eccentricAnomaly(M, e){
  M = ((M % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
  let E = e < 0.8 ? M : Math.PI;
  for (let k = 0; k < 8; k++){
    E -= (E - e*Math.sin(E) - M) / (1 - e*Math.cos(E));
  }
  return E;
}

/* position in AU, ecliptic plane */
function position(b, tDays){
  const tYr = tDays / 365.25;
  const M = (b.L0 - b.peri) * DEG + (2*Math.PI / b.P) * tYr;
  const E = eccentricAnomaly(M, b.e);
  const xv = b.a * (Math.cos(E) - b.e);
  const yv = b.a * Math.sqrt(1 - b.e*b.e) * Math.sin(E);
  const nu = Math.atan2(yv, xv);
  const r = Math.hypot(xv, yv);
  const p = (b.peri) * DEG;
  return { x: r*Math.cos(nu + p), y: r*Math.sin(nu + p), r };
}

/* radius in AU mapped to display units — compress outer system */
const RMAX = 30.07;
function auScale(rAU){
  return Math.pow(rAU / RMAX, 0.42);
}

/* ---- state ---- */
let tDays = (Date.UTC(2026,10,10) - J2000) / 86400000;
let daysPerSec = 1;
let playing = true;
let showOrbits = true, showLabels = true;
let selected = null, hovered = null;

/* ---- starfield ---- */
let stars = [];
function makeStars(){
  stars = [];
  const n = Math.min(420, Math.floor(W*H/4200));
  for (let i=0;i<n;i++){
    const z = Math.random();
    stars.push({ x: Math.random()*W, y: Math.random()*H, s: Math.random()*1.15+.18,
      a: .18 + Math.random()*.6, z, tw: Math.random()*Math.PI*2 });
  }
}
makeStars();
addEventListener('resize', makeStars);

/* ---- layout ---- */
function layout(){
  cx = W/2;
  cy = H/2 + 6;
  const maxR = Math.min(W*0.5 - 46, H*0.5 - 92);
  scale = Math.max(60, Math.min(maxR, 430));
}

/* ---- drawing ---- */
let last = performance.now();
let t0 = performance.now();

function frame(now){
  const dt = Math.min((now-last)/1000, .08); last = now;
  if (playing) tDays += dt * daysPerSec;

  layout();

  // background
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W,H)*0.75);
  g.addColorStop(0, '#0b0d15');
  g.addColorStop(.45, '#070810');
  g.addColorStop(1, '#030407');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // stars
  const tt = now/1000;
  for (const s of stars){
    const tw = .55 + .45*Math.sin(tt*1.5 + s.tw);
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = s.z > .8 ? '#e8e0cc' : '#b8c4dd';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // sun glow
  const sg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 150);
  sg.addColorStop(0,'rgba(255,238,190,.95)');
  sg.addColorStop(.07,'rgba(255,206,120,.75)');
  sg.addColorStop(.22,'rgba(255,163,60,.18)');
  sg.addColorStop(1,'rgba(255,140,40,0)');
  ctx.fillStyle = sg;
  ctx.beginPath(); ctx.arc(cx, cy, 150, 0, 7); ctx.fill();

  // orbits — sampled from the true ellipse, then radially compressed
  if (showOrbits){
    for (const b of BODIES){
      ctx.beginPath();
      for (let k=0;k<=160;k++){
        const nu = k/160*Math.PI*2;
        const rr = b.a*(1-b.e*b.e)/(1+b.e*Math.cos(nu));   // polar conic
        const ang = nu + b.peri*DEG;
        const u = auScale(rr);
        const sx = Math.cos(ang)*u, sy = Math.sin(ang)*u;
        const cr = Math.cos(rot), sr = Math.sin(rot);
        const X = sx*cr - sy*sr, Y = sx*sr + sy*cr;
        const px = cx + X*scale, py = cy + Y*scale*tilt;
        k===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
      }
      ctx.strokeStyle = b.id===selected ? 'rgba(232,207,154,.6)'
                      : b.id===hovered ? 'rgba(201,168,106,.45)' : 'rgba(201,168,106,.14)';
      ctx.lineWidth = 1; ctx.stroke();
    }
  }

  // bodies
  const pos = BODIES.map(b => ({ b, p: position(b, tDays) }));
  // sort outer-first so inner bodies draw on top
  pos.sort((A,B2) => B2.p.r - A.p.r);

  let almanacLines = [];

  for (const { b, p } of pos){
    const u = auScale(p.r);
    const ang = Math.atan2(p.y, p.x);
    const sx = Math.cos(ang) * u, sy = Math.sin(ang) * u;
    const cr = Math.cos(rot), sr = Math.sin(rot);
    const X = sx*cr - sy*sr, Y = sx*sr + sy*cr;
    const px = cx + X*scale, py = cy + Y*scale*tilt;

    const rad = Math.max(2.1, 2.2 + Math.log10(b.r/2400) * 2.15);

    // glow
    const gl = ctx.createRadialGradient(px, py, 0, px, py, rad*5.5);
    gl.addColorStop(0, b.col + 'cc');
    gl.addColorStop(.35, b.col + '44');
    gl.addColorStop(1, b.col + '00');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(px, py, rad*5.5, 0, 7); ctx.fill();

    // rings (behind)
    if (b.rings){
      ctx.save(); ctx.translate(px,py); ctx.rotate(-0.22); ctx.scale(1, .34);
      ctx.beginPath(); ctx.arc(0,0,rad*2.35,0,7);
      ctx.strokeStyle='rgba(233,211,160,.5)'; ctx.lineWidth=rad*.55; ctx.stroke();
      ctx.restore();
    }

    // body
    ctx.beginPath(); ctx.arc(px, py, rad, 0, 7);
    ctx.fillStyle = b.col; ctx.fill();
    // lit side
    ctx.beginPath(); ctx.arc(px, py, rad, 0, 7);
    const lg = ctx.createRadialGradient(px-rad*.4, py-rad*.4, 0, px, py, rad);
    lg.addColorStop(0, 'rgba(255,255,255,.45)'); lg.addColorStop(1, 'rgba(0,0,0,.25)');
    ctx.fillStyle = lg; ctx.fill();

    if (b.id === selected || b.id === hovered){
      ctx.beginPath(); ctx.arc(px, py, rad + 6.5, 0, 7);
      ctx.strokeStyle = 'rgba(232,207,154,.6)'; ctx.lineWidth = 1; ctx.stroke();
    }
    b._sx = px; b._sy = py; b._rad = rad;

    if (showLabels){
      ctx.font = '500 9px Inter, sans-serif';
      ctx.fillStyle = b.id===selected ? '#e8cf9a' : 'rgba(201,196,182,'+(b.id===hovered?.95:.62)+')';
      ctx.textAlign = 'left';
      ctx.fillText(b.name.toUpperCase(), px + rad + 7, py + 3.2);
    }

    almanacLines.push(`${b.name.toUpperCase().padEnd(8,' ')} ${u.toFixed(3)} AU`);
  }

  // comet — Halley, e=0.967, a=17.8 AU, P=75.3 yr, perihelion 1986.13
  {
    const P = 75.32, a = 17.834, e = 0.96714, peri = 1986.11;
    const tYr = ((tDays/365.25) + 2000) - peri;
    const M = (2*Math.PI/P) * (((tYr % P) + P) % P);
    let E = Math.PI; for(let k=0;k<12;k++) E -= (E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
    const xv = a*(Math.cos(E)-e), yv = a*Math.sqrt(1-e*e)*Math.sin(E);
    const nu = Math.atan2(yv,xv), r = Math.hypot(xv,yv);
    const pa = 162*DEG;
    const X0 = r*Math.cos(nu+pa), Y0 = r*Math.sin(nu+pa);
    const u = auScale(Math.min(r, RMAX*1.6));
    const ang = Math.atan2(Y0,X0);
    const sx = Math.cos(ang)*u, sy = Math.sin(ang)*u;
    const cr=Math.cos(rot), sr=Math.sin(rot);
    const px = cx + (sx*cr-sy*sr)*scale, py = cy + (sx*sr+sy*cr)*scale*tilt;
    // tail points away from sun
    const dx = px-cx, dy = py-cy, dl = Math.hypot(dx,dy) || 1;
    const tg = ctx.createLinearGradient(px,py, px+dx/dl*70, py+dy/dl*70);
    tg.addColorStop(0,'rgba(180,220,255,.55)'); tg.addColorStop(1,'rgba(120,180,255,0)');
    ctx.beginPath(); ctx.moveTo(px,py);
    ctx.lineTo(px+dx/dl*70 - dy/dl*8, py+dy/dl*70 + dx/dl*8);
    ctx.lineTo(px+dx/dl*70 + dy/dl*8, py+dy/dl*70 - dx/dl*8);
    ctx.closePath(); ctx.fillStyle = tg; ctx.fill();
    ctx.beginPath(); ctx.arc(px,py,1.6,0,7); ctx.fillStyle='#dbe9ff'; ctx.fill();
  }

  // sun disc on top
  ctx.beginPath(); ctx.arc(cx, cy, 5.2, 0, 7);
  ctx.fillStyle = '#fff3d0'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, 11, 0, 7);
  ctx.strokeStyle = 'rgba(255,220,150,.28)'; ctx.lineWidth = 1; ctx.stroke();

  // ---- HUD text ----
  const d = new Date(J2000 + tDays*86400000);
  document.getElementById('date').textContent =
    d.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}).toUpperCase();
  document.getElementById('speedlbl').textContent = speedLabel(daysPerSec);

  // almanac: nearest conjunctions
  const el = document.getElementById('almanac');
  el.innerHTML = `<b>HELIOCENTRIC</b><br>` +
    pos.slice().reverse().map(({b,p}) =>
      `${b.name.padEnd(8,' ')} ${auScale(p.r).toFixed(3)}`).join('<br>');

  requestAnimationFrame(frame);
}

function speedLabel(s){
  if (s < 1) return '¼ day / second';
  if (s === 1) return '1 day / second';
  if (s < 10) return '1 week / second';
  if (s < 100) return '1 month / second';
  if (s < 1000) return '1 year / second';
  return '1 decade / second';
}

/* ---- interaction ---- */
cv.addEventListener('mousemove', e => {
  const mx = e.clientX, my = e.clientY;
  hovered = null;
  for (const b of BODIES){
    if (b._sx === undefined) continue;
    if (Math.hypot(mx-b._sx, my-b._sy) < Math.max(14, b._rad+9)) hovered = b.id;
  }
  cv.style.cursor = hovered ? 'pointer' : 'crosshair';
});
cv.addEventListener('click', e => {
  const mx = e.clientX, my = e.clientY;
  let hit = null;
  for (const b of BODIES){
    if (b._sx !== undefined && Math.hypot(mx-b._sx, my-b._sy) < Math.max(16, b._rad+10)) hit = b;
  }
  selected = hit ? hit.id : null;
  const card = document.getElementById('card');
  if (!hit){ card.classList.remove('show'); return; }
  const p = position(hit, tDays);
  card.querySelector('.nm').textContent = hit.name;
  card.querySelector('.ty').textContent = hit.type;
  card.querySelector('dl').innerHTML = `
    <dt>distance</dt><dd>${p.r.toFixed(3)} AU</dd>
    <dt>semi-major</dt><dd>${hit.a.toFixed(3)} AU</dd>
    <dt>eccentricity</dt><dd>${hit.e.toFixed(4)}</dd>
    <dt>year</dt><dd>${(hit.P*365.25).toFixed(1)} d</dd>
    <dt>radius</dt><dd>${hit.r.toLocaleString()} km</dd>`;
  card.querySelector('.fact').textContent = hit.fact;
  let left = Math.min(mx + 22, W - 260);
  let top = Math.min(my - 40, H - 300);
  card.style.left = Math.max(14, left) + 'px';
  card.style.top = Math.max(70, top) + 'px';
  card.classList.add('show');
});

document.getElementById('play').addEventListener('click', e => {
  playing = !playing;
  e.currentTarget.textContent = playing ? '❚❚' : '▶';
});
document.querySelectorAll('.speeds button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.speeds button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    daysPerSec = parseFloat(b.dataset.sp);
  });
});
document.querySelectorAll('.toggles button').forEach(b => {
  b.addEventListener('click', () => {
    b.classList.toggle('on');
    const on = b.classList.contains('on');
    if (b.dataset.t === 'orbits') showOrbits = on;
    if (b.dataset.t === 'labels') showLabels = on;
  });
});

/* scrub: -400..400 maps to ±150 years from today */
const timeSlider = document.getElementById('time');
const tDays0 = (Date.UTC(2026,10,10) - J2000) / 86400000;
let wasPlaying = true;
timeSlider.addEventListener('pointerdown', () => { wasPlaying = playing; playing = false; });
timeSlider.addEventListener('input', () => {
  tDays = tDays0 + parseFloat(timeSlider.value) * 136;
});
timeSlider.addEventListener('change', () => {
  playing = wasPlaying;
  document.getElementById('play').textContent = playing ? '❚❚' : '▶';
});

requestAnimationFrame(frame);
</script>

<script>
/* collection navigator — appears on hover near the bottom edge */
(function(){
  var n = document.getElementById('cabnav');
  if(!n) return;
  var t;
  function reveal(){ n.classList.add('show'); clearTimeout(t);
    t = setTimeout(function(){ n.classList.remove('show'); }, 2600); }
  document.addEventListener('mousemove', function(e){
    if(e.clientY > innerHeight - 70) reveal();
  });
  window.addEventListener('touchstart', function(e){
    if(e.touches[0].clientY > innerHeight - 90) reveal();
  }, {passive:true});
  setTimeout(reveal, 600);
})();
</script>
