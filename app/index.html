<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ai1 — local chat</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#101317;color:#e8edea}*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid #303934;padding-bottom:20px}h1{font-size:1.3rem;margin:0}h1 span{color:#9de6b8}.sub{color:#9daaa2;font-size:.9rem;margin:5px 0 0}label{font-size:.8rem;color:#a7b6ab}input,textarea,button{font:inherit}input,textarea{background:#1b211e;border:1px solid #39483f;color:#f1f5f2;border-radius:9px;padding:11px}input{display:block;width:170px;margin-top:5px}#chat{min-height:48vh;padding:24px 0;display:flex;flex-direction:column;gap:18px}.empty{margin:auto;text-align:center;color:#9daaa2}.empty strong{color:#dbe9dd;font-size:1.3rem;display:block;margin-bottom:8px}.message{max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;padding:14px 17px;border-radius:14px;background:#202923}.message.user{align-self:flex-end;background:#294637}.message b{display:block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:#9de6b8;margin-bottom:5px}form{display:flex;gap:10px;align-items:flex-end}textarea{resize:vertical;min-height:58px;max-height:200px;flex:1}button{border:0;border-radius:9px;background:#a6e8bc;color:#102218;font-weight:700;padding:17px 22px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#9daaa2;font-size:.8rem;margin-top:12px}.toolbar button{padding:0;background:none;color:#a6e8bc;font-size:.85rem}.error{color:#ffb7a6;min-height:1.4em;font-size:.9rem;margin:10px 0 0}@media(max-width:520px){header{align-items:flex-start;flex-direction:column}input{width:100%}label{width:100%}.message{max-width:100%}}
</style>
</head>
<body><main>
<header><div><h1>Ai1 <span>✳</span></h1><p class="sub">Your local AI starting point</p></div><label for="model">Ollama model<input id="model" value="qwen2.5:0.5b" spellcheck="false"></label></header>
<div id="chat" aria-live="polite"><div class="empty"><strong>Let's make something.</strong>Say hello to your local model to get started.</div></div>
<form id="form"><textarea id="prompt" placeholder="Message your model..." aria-label="Message" required></textarea><button id="send">Send ↑</button></form>
<p class="error" id="error" role="alert"></p><div class="toolbar"><span>Runs through Ollama on your machine. Chat stays in this tab.</span><button type="button" id="clear">New chat</button></div>
</main>
<script>
const chat=document.querySelector('#chat'), form=document.querySelector('#form'), promptBox=document.querySelector('#prompt'), model=document.querySelector('#model'), error=document.querySelector('#error'), send=document.querySelector('#send'), clear=document.querySelector('#clear');
let messages=[], busy=false;
fetch('/api/config').then(r=>r.json()).then(c=>{model.value=c.model}).catch(()=>{});
function render(){chat.replaceChildren();if(!messages.length){const e=document.createElement('div');e.className='empty';const strong=document.createElement('strong');strong.textContent="Let's make something.";e.append(strong, 'Say hello to your local model to get started.');chat.append(e);return}for(const m of messages){const el=document.createElement('div');el.className='message '+m.role;const name=document.createElement('b');name.textContent=m.role==='user'?'You':'Ai1';el.append(name,document.createTextNode(m.content));chat.append(el)}chat.lastChild.scrollIntoView({block:'nearest'});}
form.addEventListener('submit',async e=>{e.preventDefault();const text=promptBox.value.trim();if(!text||busy)return;const pending=[...messages,{role:'user',content:text}];messages=pending;promptBox.value='';render();busy=true;send.disabled=true;clear.disabled=true;model.disabled=true;error.textContent='Thinking…';try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:model.value,messages:pending})});const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');messages=[...pending,{role:'assistant',content:data.message}];error.textContent='';render()}catch(err){messages=messages.slice(0,-1);promptBox.value=text;render();error.textContent=err.message}finally{busy=false;send.disabled=false;clear.disabled=false;model.disabled=false;promptBox.focus()}});
clear.addEventListener('click',()=>{messages=[];error.textContent='';render();promptBox.focus()});
promptBox.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
</script></body></html>
