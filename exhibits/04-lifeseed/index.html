<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Life Seed — a creature made of code</title>
<style>
:root{--bg:#08090d;--paper:#efe9dd;--dim:#8b8778;--brass:#c9a86a;--brass-hi:#e8cf9a;
--line:rgba(201,168,106,.18);--mono:"JetBrains Mono",ui-monospace,monospace;--sans:"Inter",-apple-system,"Segoe UI",sans-serif;
--serif:"Cormorant Garamond",Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--paper);font-family:var(--sans)}
canvas{position:absolute;inset:0;display:block;touch-action:none}

#top{position:absolute;top:0;left:0;right:0;padding:20px 24px;display:flex;justify-content:space-between;
align-items:flex-start;pointer-events:none;z-index:6}
h1{font-family:var(--serif);font-weight:300;font-size:27px;line-height:1}
h1 em{font-style:italic;color:var(--brass-hi)}
.sub{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);margin-top:8px}

#vitals{display:flex;gap:20px;font-family:var(--mono);font-size:9.5px;pointer-events:none}
#vitals div{text-align:right}
#vitals .lbl{color:var(--dim);letter-spacing:.12em;text-transform:uppercase;font-size:8px;margin-bottom:4px}
#vitals .val{color:var(--brass-hi);font-size:14px;font-variant-numeric:tabular-nums}
#vitals .bar{width:64px;height:2px;background:rgba(201,168,106,.16);margin-top:5px;overflow:hidden}
#vitals .bar i{display:block;height:100%;background:var(--brass);transition:width .35s}

#panel{position:absolute;left:24px;bottom:24px;width:268px;z-index:6;
background:linear-gradient(165deg,rgba(18,21,29,.93),rgba(8,9,13,.95));
border:1px solid rgba(201,168,106,.22);border-radius:3px;padding:16px 17px;backdrop-filter:blur(16px)}
#panel .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#panel .hd b{font-family:var(--serif);font-size:17px;font-weight:400;color:var(--brass-hi)}
#panel .hd span{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
#genes{display:grid;gap:5px;margin-bottom:13px}
.gene{display:grid;grid-template-columns:56px 1fr 28px;align-items:center;gap:8px;font-size:9px}
.gene .n{color:var(--dim);letter-spacing:.06em;font-family:var(--mono)}
.gene .t{height:3px;background:rgba(201,168,106,.12);border-radius:2px;overflow:hidden}
.gene .t i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-hi));transition:width .5s}
.gene .v{font-family:var(--mono);font-size:8.5px;color:var(--brass);text-align:right}
#mood{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--brass-hi);line-height:1.45;
border-top:1px solid rgba(201,168,106,.14);padding-top:11px;min-height:44px}
#log{position:absolute;right:24px;bottom:24px;width:250px;z-index:6;font-family:var(--mono);font-size:9px;
line-height:1.85;color:var(--dim);text-align:right;pointer-events:none;max-height:150px;overflow:hidden}
#log b{color:var(--brass);font-weight:400}
#hintbar{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:6;
font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:rgba(139,135,120,.7);text-align:center;
pointer-events:none;line-height:2}
#btns{position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding-top:20px;z-index:7}
#btns button{background:rgba(15,17,24,.8);border:1px solid var(--line);color:var(--dim);cursor:pointer;
padding:7px 12px;border-radius:100px;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase;
font-family:var(--sans);transition:.3s;backdrop-filter:blur(10px)}
#btns button:hover{color:var(--brass-hi);border-color:rgba(201,168,106,.45)}
@media(max-width:820px){#panel{width:calc(100% - 32px);left:16px;bottom:16px}#log{display:none}
#hintbar{display:none}#vitals{gap:12px}}

/* --- collection navigator --- */
#cabnav{position:fixed;left:0;right:0;bottom:0;z-index:8000;display:flex;align-items:center;
justify-content:center;gap:5px;padding:7px 12px;background:rgba(7,8,13,.82);
border-top:1px solid rgba(201,168,106,.13);backdrop-filter:blur(14px);
font-family:"Inter",-apple-system,sans-serif;transform:translateY(105%);
transition:transform .45s cubic-bezier(.16,1,.3,1)}
#cabnav.show{transform:none}
#cabnav a{font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:#6f6a60;
text-decoration:none;padding:5px 8px;border-radius:3px;transition:.25s;white-space:nowrap}
#cabnav a:hover{color:#e8cf9a;background:rgba(201,168,106,.13)}
#cabnav a.cur{color:#c9a86a;background:rgba(201,168,106,.1)}
#cabnav .home{color:#c9a86a;border-right:1px solid rgba(201,168,106,.18);margin-right:4px;padding-right:12px}
@media(max-width:620px){#cabnav a{font-size:7px;padding:4px 4px;letter-spacing:.04em}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div>
    <h1>Life <em>Seed</em></h1>
    <div class="sub">a creature, not an animation</div>
  </div>
  <div id="vitals">
    <div><div class="lbl">heart</div><div class="val" id="v-hr">—</div><div class="bar"><i id="b-hr" style="width:60%"></i></div></div>
    <div><div class="lbl">energy</div><div class="val" id="v-en">—</div><div class="bar"><i id="b-en" style="width:80%"></i></div></div>
    <div><div class="lbl">trust</div><div class="val" id="v-tr">—</div><div class="bar"><i id="b-tr" style="width:50%"></i></div></div>
  </div>
</div>

<div id="btns">
  <button id="feed">Feed</button>
  <button id="poke">Startle</button>
  <button id="call">Call it</button>
  <button id="newlife">New life</button>
</div>

<div id="panel">
  <div class="hd"><b id="p-name">—</b><span id="p-age">0.0s</span></div>
  <div id="genes"></div>
  <div id="mood">…</div>
</div>

<div id="log"></div>
<div id="hintbar">move the cursor — it watches · click to touch · press F to feed, S to startle</div>

<script>
/* ============================================================
   LIFE SEED
   A creature with a genome, an energy budget, a heartbeat,
   a vestibular system, a memory and a temperament.
   Nothing here is keyframed — position is integrated each frame
   from forces the creature actually computes.
   ============================================================ */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- genome ---------- */
const NAMES=['size','speed','curiosity','timidity','warmth','tempo'];
let G={};

function newGenome(){
  const pick=()=>Math.pow(Math.random(),1.35);   // biased toward small/gentle
  G={
    size:      lerp(.55,1.5,pick()),
    speed:     lerp(.5,1.7,pick()),
    curiosity: pick(),
    timidity:  lerp(.15,1,Math.random()),
    warmth:    pick(),
    tempo:     lerp(.75,1.35,pick())
  };
  // personality readout
  const adj=[];
  if(G.timidity>.7) adj.push('easily startled');
  else if(G.timidity<.3) adj.push('fearless');
  if(G.curiosity>.7) adj.push('insatiably curious');
  else if(G.curiosity<.25) adj.push('aloof');
  if(G.warmth>.7) adj.push('affectionate');
  else if(G.warmth<.25) adj.push('standoffish');
  G.desc = adj.slice(0,2).join(', ')||'even-tempered';
}

/* ---------- creature state ---------- */
let C={};
function newLife(keepPos){
  newGenome();
  C={
    x: keepPos?C.x:W/2, y: keepPos?C.y:H/2,
    vx:0, vy:0,
    energy: .78, trust: .35, fear: 0, arousal: 0,
    hr: 60,
    /* body: a ring of limbs, each with its own phase */
    limbs: Array.from({length: 9}, (_,i)=>({ ph: rnd(0,TAU), len: rnd(.7,1.25), sp: rnd(.75,1.3) })),
    blink: 0, blinkT: rnd(2,6),
    /* vestibular: head lags behind body */
    hx: 0, hy: 0,
    mood: '',
    memory: [],          // recent significant events
    lastFed: 0, age: 0,
    name: pickName(),
    hue: rnd(28,44),
    pupil: .5,
    glow: .6
  };
  document.getElementById('p-name').textContent = C.name;
  refreshGenes();
  log(`<b>${C.name}</b> was born · ${G.desc}`);
}

const SYL=['ka','mo','lu','ri','sen','ta','vo','nul','ae','shi','or','my','tha','qui','bel','za'];
function pickName(){
  let n='';
  const k=Math.random()<.5?2:3;
  for(let i=0;i<k;i++) n+=SYL[Math.floor(Math.random()*SYL.length)];
  return n[0].toUpperCase()+n.slice(1);
}

/* ---------- environment ---------- */
let mouse={x:W/2,y:H/2,inside:false,down:false,lastMove:0};
let sparks=[];
let motes=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,
  vx:rnd(-.12,.12),vy:rnd(-.12,.12),r:rnd(.5,1.7),a:rnd(.06,.3)}));

addEventListener('pointermove',e=>{
  mouse.x=e.clientX; mouse.y=e.clientY; mouse.inside=true; mouse.lastMove=performance.now();
});
addEventListener('pointerleave',()=>mouse.inside=false);
addEventListener('pointerdown',e=>{
  mouse.down=true;
  const d=Math.hypot(e.clientX-C.x,e.clientY-C.y);
  if(d<90){ touch(); }
  else { C.curiosityTarget={x:e.clientX,y:e.clientY,t:performance.now()}; }
  mouse.x=e.clientX;mouse.y=e.clientY;
});
addEventListener('pointerup',()=>mouse.down=false);

/* ---------- behaviours ---------- */
function log(msg){
  const el=document.getElementById('log');
  el.innerHTML = msg + '<br>' + el.innerHTML;
  if(el.children.length>9) el.removeChild(el.lastChild);
  C.memory.push({t:performance.now(),m:msg});
}

function touch(){
  // gentle contact — trust rises if not startled
  const startle = Math.random() < G.timidity*0.7 + (C.fear*.4);
  if(startle){
    C.fear = Math.min(1, C.fear + .45);
    C.energy -= .04;
    log(`<b>${C.name}</b> flinched. It did not expect you.`);
    burst(C.x, C.y, 12, 'scared');
  } else {
    C.trust = Math.min(1, C.trust + .07);
    C.arousal = Math.min(1, C.arousal + .3);
    log(`<b>${C.name}</b> leaned into your hand.`);
    burst(C.x, C.y, 9, 'warm');
  }
}
function feed(){
  const d=Math.hypot(mouse.x-C.x,mouse.y-C.y);
  if(d<420){
    C.energy=Math.min(1,C.energy+.22);
    C.trust=Math.min(1,C.trust+.05);
    C.lastFed=performance.now();
    log(`Fed. <b>${C.name}</b> is ${C.energy>.85?'sated':'a little brighter'}.`);
    burst(C.x,C.y,18,'food');
  } else {
    log(`Too far. Move closer, then press F.`);
  }
}
function startle(){
  C.fear=Math.min(1,C.fear+.6);
  C.energy-=.05;
  log(`<b>${C.name}</b> bolted from the noise.`);
  burst(C.x,C.y,16,'scared');
}
function call(){
  C.curiosityTarget={x:C.x+rnd(-120,120),y:C.y+rnd(-120,120),t:performance.now()};
  C.arousal=Math.min(1,C.arousal+.4);
  C.trust=Math.min(1,C.trust+.02);
  log(`You called. <b>${C.name}</b> turned toward the sound.`);
}

function burst(x,y,n,kind){
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU, s=rnd(.6,3.4);
    sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,kind,hue:rnd(30,48)});
  }
}

/* ---------- physics ---------- */
let t0=performance.now();
let last=t0;

function step(dt,now){
  C.age += dt;

  /* nearest threat = fast cursor motion */
  const dxm=mouse.x-C.x, dym=mouse.y-C.y, dm=Math.hypot(dxm,dym)||1;
  const cursorSpeed = Math.hypot(mouse.x-(mouse.px??mouse.x), mouse.y-(mouse.py??mouse.y))/Math.max(dt,.001);
  mouse.px=mouse.x; mouse.py=mouse.y;

  /* fear decays; arousal decays */
  C.fear = Math.max(0, C.fear - dt*(0.16 + C.trust*0.12));
  C.arousal = Math.max(0, C.arousal - dt*0.35);

  /* cursor-induced alarm */
  if(mouse.inside && cursorSpeed > 900 && dm < 300){
    C.fear = Math.min(1, C.fear + dt*1.6*G.timidity);
  }

  /* ---- desire: where does it want to be? ---- */
  let tx=C.x, ty=C.y, urgency=0;

  if(C.fear > .25){
    // flee
    tx = C.x - dxm/dm*260;
    ty = C.y - dym/dm*260;
    urgency = C.fear*1.5;
  } else if(mouse.inside && dm < 260 && G.curiosity > .3){
    // approach with a respectful gap
    const gap = 74 + G.timidity*60;
    tx = mouse.x - dxm/dm*gap;
    ty = mouse.y - dym/dm*gap;
    urgency = G.curiosity * (1-C.fear) * .9;
  } else if(C.curiosityTarget && now - C.curiosityTarget.t < 6500){
    tx=C.curiosityTarget.x; ty=C.curiosityTarget.y; urgency=.7;
  } else {
    // wander — smooth noise-ish drift
    const t=now/1000;
    tx = W/2 + Math.sin(t*0.37+C.hue)*W*0.24 + Math.sin(t*0.11)*W*0.1;
    ty = H/2 + Math.cos(t*0.29+C.hue)*H*0.2 + Math.sin(t*0.17)*H*0.08;
    urgency = .25 + C.arousal*.5;
  }

  /* energy modulates speed; fear multiplies it */
  const tired = .45 + C.energy*.75;
  const spd = 190 * G.speed * tired * (1 + urgency);
  const ax = (tx-C.x), ay=(ty-C.y), ad=Math.hypot(ax,ay)||1;
  const accel = 900 * G.speed;
  C.vx += ax/ad*accel*dt*Math.min(1, ad/70);
  C.vy += ay/ad*accel*dt*Math.min(1, ad/70);

  /* drag */
  const damp = Math.pow(.0016, dt);
  C.vx*=damp; C.vy*=damp;
  const sp=Math.hypot(C.vx,C.vy);
  const cap=spd;
  if(sp>cap){ C.vx*=cap/sp; C.vy*=cap/sp; }

  C.x += C.vx*dt; C.y += C.vy*dt;

  /* walls — soft repulsion, it hates edges */
  const m=110;
  if(C.x<m) C.vx += (m-C.x)*9*dt;
  if(C.x>W-m) C.vx -= (C.x-(W-m))*9*dt;
  if(C.y<m) C.vy += (m-C.y)*9*dt;
  if(C.y>H-m) C.vy -= (C.y-(H-m))*9*dt;
  C.x=clamp(C.x,20,W-20); C.y=clamp(C.y,20,H-20);

  /* head lag (vestibular) */
  C.hx = lerp(C.hx, C.vx*0.055, 1-Math.pow(.001,dt));
  C.hy = lerp(C.hy, C.vy*0.055, 1-Math.pow(.001,dt));

  /* heartbeat: sympathetic tone */
  const target = 44 + C.energy*26 + C.fear*120 + C.arousal*34;
  C.hr = lerp(C.hr, target*G.tempo, 1-Math.pow(.2,dt));

  /* metabolism */
  C.energy -= dt*(0.022 + sp*0.00012 + C.fear*0.05);
  if(C.energy < 0) C.energy = 0;
  if(C.energy < .18){
    // starving: sluggish, dim
    C.energy += 0; // no miracle
  }

  /* blinking */
  C.blinkT -= dt;
  if(C.blinkT<0){ C.blink=1; C.blinkT=rnd(2.2,6.5)/(1+C.fear); }
  C.blink=Math.max(0,C.blink-dt*6);

  /* pupil follows cursor */
  const px=(mouse.x-(C.x+C.hx))/Math.max(40,dm);
  C.pupil = lerp(C.pupil, clamp(px,-1,1)*.5+.5, 1-Math.pow(.05,dt));

  /* glow */
  const targetGlow = .3 + C.energy*.55 + C.trust*.3 + C.arousal*.25 - C.fear*.2;
  C.glow = lerp(C.glow, clamp(targetGlow,.1,1.4), 1-Math.pow(.3,dt));

  /* mood text */
  C.mood =
    C.fear>.55 ? 'Frightened. It wants distance from you.' :
    C.energy<.2 ? 'Hungry. Its light is going out.' :
    C.arousal>.6 ? 'Excited — something in it is ringing.' :
    C.trust>.72 ? 'Content. It has decided you are safe.' :
    C.trust<.2 ? 'Watchful. It has not decided about you yet.' :
    G.curiosity>.65 ? 'Curious. It is studying your cursor.' :
    'Resting. It is thinking about nothing in particular.';

  /* vitals */
  document.getElementById('v-hr').textContent = Math.round(C.hr);
  document.getElementById('v-en').textContent = Math.round(C.energy*100)+'%';
  document.getElementById('v-tr').textContent = Math.round(C.trust*100)+'%';
  document.getElementById('b-hr').style.width = clamp(C.hr/180*100,3,100)+'%';
  document.getElementById('b-en').style.width = (C.energy*100)+'%';
  document.getElementById('b-tr').style.width = (C.trust*100)+'%';
  document.getElementById('p-age').textContent = C.age.toFixed(1)+'s';
  document.getElementById('mood').textContent = C.mood;

  /* sparks */
  for(const s of sparks){ s.x+=s.vx; s.y+=s.vy; s.vy+=.02; s.life-=dt*1.5; }
  sparks=sparks.filter(s=>s.life>0);
  for(const m of motes){
    m.x+=m.vx; m.y+=m.vy;
    if(m.x<0)m.x=W; if(m.x>W)m.x=0; if(m.y<0)m.y=H; if(m.y>H)m.y=0;
  }
}

/* ---------- rendering ---------- */
function render(now){
  const bgg=ctx.createRadialGradient(C.x,C.y,0,C.x,C.y,Math.max(W,H)*.8);
  bgg.addColorStop(0,'#0d0f16'); bgg.addColorStop(.5,'#090a10'); bgg.addColorStop(1,'#050609');
  ctx.fillStyle=bgg; ctx.fillRect(0,0,W,H);

  // motes
  for(const m of motes){
    ctx.globalAlpha=m.a; ctx.fillStyle='#c9a86a';
    ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;

  const t=now/1000;
  const breathe = 1 + Math.sin(t*(1.6*(C.hr/70)))*0.022;
  const S = 34*G.size*breathe;

  const cx=C.x, cy=C.y;
  const ang=Math.atan2(C.hy,C.hx);
  const speed=Math.hypot(C.vx,C.vy);

  // ---------- limbs ----------
  ctx.save();
  ctx.translate(cx,cy);
  for(let i=0;i<C.limbs.length;i++){
    const L=C.limbs[i];
    const base=i/C.limbs.length*TAU;
    // each limb swings with its own phase, excited by speed and fear
    const swing=Math.sin(t*(2.4*G.tempo)+L.ph)*(0.25+speed*0.0022+C.fear*.4);
    const a=base+swing;
    const len=S*1.5*L.len*(1+C.arousal*.12);
    const x1=Math.cos(a)*S*0.75, y1=Math.sin(a)*S*0.75;
    const cxp=Math.cos(a+swing*.7)*len*.7, cyp=Math.sin(a+swing*.7)*len*.7;
    const x2=Math.cos(a+swing*.55)*len, y2=Math.sin(a+swing*.55)*len;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.quadraticCurveTo(cxp,cyp,x2,y2);
    ctx.strokeStyle=`hsla(${C.hue},52%,${34+C.glow*22}%,${.42+C.glow*.3})`;
    ctx.lineWidth=Math.max(1.1,S*.115);
    ctx.lineCap='round';
    ctx.stroke();
    // tip light
    const tiph=clamp(C.energy,0,.5);
    ctx.globalAlpha=.35+C.glow*.4;
    ctx.fillStyle=`hsl(${C.hue},70%,${58+tiph*20}%)`;
    ctx.beginPath(); ctx.arc(x2,y2,Math.max(.8,S*.075),0,TAU); ctx.fill();
    ctx.globalAlpha=1;
  }
  ctx.restore();

  // ---------- aura ----------
  const gl=RAD => {
    const gr=ctx.createRadialGradient(cx+C.hx,cy+C.hy,0,cx+C.hx,cy+C.hy,RAD);
    gr.addColorStop(0,`hsla(${C.hue},85%,72%,${.16*C.glow})`);
    gr.addColorStop(.45,`hsla(${C.hue},80%,60%,${.05*C.glow})`);
    gr.addColorStop(1,`hsla(${C.hue},80%,50%,0)`);
    return gr;
  };
  ctx.fillStyle=gl(S*5.5);
  ctx.beginPath(); ctx.arc(cx+C.hx,cy+C.hy,S*5.5,0,TAU); ctx.fill();

  // ---------- body ----------
  const bx=cx+C.hx*.35, by=cy+C.hy*.35;
  // membrane: perturbed circle, squashed toward direction of travel
  ctx.save();
  ctx.translate(bx,by); ctx.rotate(ang);
  ctx.beginPath();
  const N=96;
  for(let i=0;i<=N;i++){
    const a=i/N*TAU;
    let r=S*(1
      + Math.sin(a*3+t*2.2)*0.035
      + Math.sin(a*5-t*1.7+C.hue)*0.022
      + Math.cos(a*2+t*1.1)*0.02);
    r *= 1 + Math.min(.18, speed*0.00035) * Math.cos(a*2);
    r *= 1 - Math.min(.14, speed*0.00028) * Math.cos(a);
    const x=Math.cos(a)*r, y=Math.sin(a)*r*.92;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath();
  const bg=ctx.createRadialGradient(S*.3,0,0,0,0,S*1.5);
  bg.addColorStop(0,`hsla(${C.hue},72%,${58+C.glow*16}%,.95)`);
  bg.addColorStop(.55,`hsla(${C.hue},64%,${36+C.glow*10}%,.92)`);
  bg.addColorStop(1,`hsla(${C.hue-8},55%,${20+C.glow*6}%,.88)`);
  ctx.fillStyle=bg;
  ctx.shadowColor=`hsla(${C.hue},90%,60%,${.5*C.glow})`;
  ctx.shadowBlur=30+C.glow*40;
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle=`hsla(${C.hue},80%,80%,${.28+C.glow*.25})`;
  ctx.lineWidth=1;
  ctx.stroke();
  ctx.restore();

  // ---------- nucleus (its heart) ----------
  const beat=Math.pow(Math.max(0,Math.sin(t*(C.hr/60)*TAU)),6);
  const nr=S*(.30+beat*.10);
  const ng=ctx.createRadialGradient(bx-nr*.3,by-nr*.3,0,bx,by,nr);
  ng.addColorStop(0,'#fff8e6'); ng.addColorStop(.4,`hsl(${C.hue+6},90%,70%)`);
  ng.addColorStop(1,`hsla(${C.hue-10},70%,45%,.15)`);
  ctx.fillStyle=ng;
  ctx.beginPath(); ctx.arc(bx,by,nr,0,TAU); ctx.fill();
  if(beat>.1){
    ctx.strokeStyle=`hsla(${C.hue},90%,75%,${beat*.35})`;
    ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(bx,by,nr+beat*22,0,TAU); ctx.stroke();
  }

  // ---------- eyes ----------
  const eyeA = Math.atan2(mouse.y-(cy+C.hy), mouse.x-(cx+C.hx));
  const eyeD = S*.52;
  for(const sgn of [-1,1]){
    const ex=bx+Math.cos(eyeA+sgn*.55)*eyeD*0.55;
    const ey=by+Math.sin(eyeA+sgn*.55)*eyeD*0.55;
    const er=S*.185*(1+C.arousal*.1);
    // sclera
    ctx.beginPath(); ctx.arc(ex,ey,er,0,TAU);
    ctx.fillStyle=`hsla(${C.hue},30%,${92-C.fear*8}%,.94)`;
    ctx.fill();
    // pupil
    const pdx=Math.cos(eyeA)*er*.36, pdy=Math.sin(eyeA)*er*.36;
    ctx.beginPath(); ctx.arc(ex+pdx,ey+pdy,er*(.52+C.fear*.2),0,TAU);
    ctx.fillStyle=C.fear>.5?'#3a1010':'#14100c';
    ctx.fill();
    // shine
    ctx.beginPath(); ctx.arc(ex+pdx-er*.2,ey+pdy-er*.22,er*.16,0,TAU);
    ctx.fillStyle='rgba(255,255,255,.9)'; ctx.fill();
    // lid (blink)
    if(C.blink>0){
      const lid=Math.min(1,C.blink);
      ctx.beginPath();
      ctx.rect(ex-er-1, ey-er-1, er*2+2, er*2*lid+1);
      ctx.fillStyle=`hsl(${C.hue},45%,${30+C.glow*10}%)`;
      ctx.fill();
    }
  }

  // ---------- sparks ----------
  for(const s of sparks){
    const a=clamp(s.life,0,1);
    ctx.globalAlpha=a*.9;
    ctx.fillStyle = s.kind==='scared' ? `hsla(8,80%,62%,${a})`
                  : s.kind==='food'   ? `hsla(58,85%,66%,${a})`
                  : `hsla(${s.hue},85%,70%,${a})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,1.8*a+0.4,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;

  // ---------- cursor tether ----------
  if(mouse.inside){
    const dm=Math.hypot(mouse.x-cx,mouse.y-cy);
    if(dm<300){
      ctx.beginPath();
      ctx.moveTo(cx+C.hx,cy+C.hy);
      ctx.lineTo(mouse.x,mouse.y);
      ctx.strokeStyle=`rgba(201,168,106,${(1-dm/300)*.13})`;
      ctx.setLineDash([2,6]); ctx.lineWidth=1; ctx.stroke(); ctx.setLineDash([]);
    }
    // cursor ring
    ctx.beginPath(); ctx.arc(mouse.x,mouse.y,9,0,TAU);
    ctx.strokeStyle=`rgba(201,168,106,${mouse.down?.6:.28})`; ctx.lineWidth=1; ctx.stroke();
  }
  // ground ellipse
  const gy=cy+S*1.55;
  const gs=ctx.createRadialGradient(cx,gy,0,cx,gy,S*1.5);
  gs.addColorStop(0,'rgba(0,0,0,.4)'); gs.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=gs;
  ctx.beginPath(); ctx.ellipse(cx,gy,S*1.5,S*.4,0,0,TAU); ctx.fill();
}

/* ---------- genes panel ---------- */
function refreshGenes(){
  const rows=[
    ['size',G.size/1.5],['speed',G.speed/1.7],['curious',G.curiosity],
    ['timid',G.timidity],['warmth',G.warmth],['tempo',(G.tempo-.75)/.6]
  ];
  document.getElementById('genes').innerHTML = rows.map(([n,v])=>
    `<div class="gene"><span class="n">${n}</span><span class="t"><i style="width:${clamp(v,0,1)*100}%"></i></span><span class="v">${clamp(v,0,1).toFixed(2)}</span></div>`
  ).join('');
}

/* ---------- buttons ---------- */
document.getElementById('feed').onclick=feed;
document.getElementById('poke').onclick=startle;
document.getElementById('call').onclick=call;
document.getElementById('newlife').onclick=()=>newLife(true);
addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F') feed();
  if(e.key==='s'||e.key==='S') startle();
  if(e.key==='c'||e.key==='C') call();
});

/* ---------- loop ---------- */
newLife();
C.energy=.82;
log(`A seed opened. Something is <b>awake</b>.`);
log(`Genome: ${G.desc}.`);

function loop(now){
  const dt=Math.min((now-last)/1000,.05); last=now;
  step(dt,now);
  render(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

<script>
/* collection navigator — appears on hover near the bottom edge */
(function(){
  var n = document.getElementById('cabnav');
  if(!n) return;
  var t;
  function reveal(){ n.classList.add('show'); clearTimeout(t);
    t = setTimeout(function(){ n.classList.remove('show'); }, 2600); }
  document.addEventListener('mousemove', function(e){
    if(e.clientY > innerHeight - 70) reveal();
  });
  window.addEventListener('touchstart', function(e){
    if(e.touches[0].clientY > innerHeight - 90) reveal();
  }, {passive:true});
  setTimeout(reveal, 600);
})();
</script>
